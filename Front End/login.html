<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Student Course Management</title>
<link rel="stylesheet" href="login.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<nav>
<div class="logo">Course Management</div>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="courses.html">Courses</a></li>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="progress.html">Progress</a></li>
<li><a href="login.html">Login</a></li>
<li><a href="register.html">Register</a></li>
</ul>
</nav>

<section class="auth-section">
<div class="auth-card">
<div class="auth-icon">🔐</div>
<h1>Welcome back</h1>
<p>Login to continue learning and track your progress.</p>

<form action="#" method="POST">
<div class="form-group">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" placeholder="you@example.com" required>
</div>

<div class="form-group">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password" required>
</div>

<div class="form-row">
<label class="checkbox"><input type="checkbox" name="remember"> Remember me</label>
<a href="#" class="forgot-link">Forgot password?</a>
</div>

<button type="submit" class="btn btn-full">Login</button>
</form>

<div class="auth-divider">or</div>
<p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
</div>
</section>

<footer>
<p>© 2026 Student Course Management System | All Rights Reserved</p>
</footer>

</body>
</html>
